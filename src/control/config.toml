# Gesture -> action bindings.
#
# Edit this file to change behaviour without touching code.
# `mode`:
#   trigger -> action fires once when the gesture appears
#   hold    -> action is active the whole time the gesture is held
#              (and `release` runs when the gesture ends)
# `hand` is optional: "Left", "Right", or omit for any hand.
# `interval_ms` (hold only) throttles repeats; 0 = every frame.

backend = "ydotool"   # "null" (dry-run) | "pynput" (X11) | "ydotool" (Wayland)
dry_run = false       # safety: when true, nothing is actually typed/clicked

# ydotool sends *physical* keycodes, and the active layout turns them into
# letters. On a non-Latin layout `key = "g"` would produce `п`. To keep
# Latin bindings correct, the backend briefly switches to this layout around
# every key press and then restores yours. Set to "none" to disable, or to a
# layout code/name from your system (e.g. "us", "ru", "English (US)").
layout = "us"

# --- mouse control --------------------------------------------------------
# move the cursor (trackpad-style) while the LEFT hand makes "pen_hold":
# the hand's motion becomes relative mouse movement

[[binding]]
gesture = "pen_hold"
hand = "Left"
mode = "hold"
  [binding.action]
  type = "mouse_move"
  sensitivity = 1200.0   # how far the cursor travels per hand motion
  deadzone = 0.004       # ignore tiny jitter
  smoothing = 0.4        # 0 = responsive/raw, ->1 = smoother but laggier

# --- chat macro -----------------------------------------------------------
# RIGHT hand "f_sign": open chat, paste a random line from a CSV, send it.

[[binding]]
gesture = "f_sign"
hand = "Right"
mode = "trigger"
  [binding.action]
  type = "send_random_line"
  csv_path = "src/control/insults_dataset.csv"
  open_chat = "shift_enter"   # "shift_enter" = command chat | "enter" = normal
  send = "enter"              # "enter" | "shift_enter"
